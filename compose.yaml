services:
  yugioh-printing:
    image: node:22-alpine
    container_name: yugioh-printing
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --webpack -H 0.0.0.0 -p 3000"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - yugioh-printing-node-modules:/app/node_modules
      - yugioh-printing-next-cache:/app/.next
    restart: unless-stopped

volumes:
  yugioh-printing-node-modules:
  yugioh-printing-next-cache:
